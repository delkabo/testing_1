<VirtualHost *:80>
  ServerName course-lab.ru
  ServerAdmin admin@course-lab.ru
  <Directory "/var/www/course-lab.ru">
    AllowOverride All
    Require all granted
  </Directory>
  DocumentRoot /var/www/course-lab.ru/html
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
